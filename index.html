<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
<title>Cartelera · Work &amp; Fun '26</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:#06122c}
  body{
    font-family:"HP Simplified","Helvetica Neue",Arial,Helvetica,sans-serif;
    color:#ffffff;
    -webkit-font-smoothing:antialiased;
    cursor:none;
  }

  /* ESCENARIO que llena la pantalla (flex, sin grid ni variables CSS: compatible con TVs viejas) */
  #stage{
    position:fixed;top:0;right:0;bottom:0;left:0;
    background:#0a1b3f;
    background:radial-gradient(120% 120% at 80% -10%, #0c2a66 0%, #0a1b3f 45%, #06122c 100%);
    display:-webkit-box;display:-webkit-flex;display:flex;
    -webkit-box-orient:vertical;-webkit-box-direction:normal;-webkit-flex-direction:column;flex-direction:column;
  }
  .stripe{height:8px;-webkit-flex:0 0 auto;flex:0 0 auto;background:linear-gradient(90deg,#024AD8 0%,#024AD8 33%,#568393 33%,#568393 66%,#FF5050 66%,#FF5050 100%)}

  /* BARRA SUPERIOR */
  .topbar{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    padding:30px 76px 18px;
  }
  .brand-logo{height:62px;width:auto;display:block;-webkit-filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
  .brandtxt{line-height:1.15;margin-left:42px}
  .brandtxt .team{font-size:30px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .brandtxt .team .amp{color:#FF5050}
  .brandtxt .sub{font-size:13px;color:#aab8d6;letter-spacing:3.5px;text-transform:uppercase;margin-top:6px}
  .right{margin-left:auto;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
  .clockbox{text-align:right;white-space:nowrap;margin-left:64px}
  .wx{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;white-space:nowrap}
  .wx-ic{font-size:46px;line-height:1}
  .wx-meta{line-height:1.1;margin-left:16px}
  .wx-temp{font-size:34px;font-weight:700}
  .wx-city{font-size:13px;color:#aab8d6;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
  .clockbox .time{font-size:40px;font-weight:700;line-height:1}
  .clockbox .date{font-size:15px;color:#aab8d6;text-transform:capitalize;margin-top:4px}

  /* ÁREA DE SLIDES */
  #slides{position:relative;overflow:hidden;-webkit-box-flex:1;-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0}
  .slide{
    position:absolute;top:0;right:0;bottom:0;left:0;
    padding:30px 80px 18px;
    display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;
    opacity:0;
    -webkit-transition:opacity .7s ease;transition:opacity .7s ease;
    pointer-events:none;
  }
  .slide.active{opacity:1;pointer-events:auto}

  .eyebrow{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    font-size:17px;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;
    color:#568393;margin-bottom:26px;
  }
  .eyebrow .dot{-webkit-flex:0 0 auto;flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:#FF5050;margin-right:22px;box-shadow:0 0 0 5px rgba(255,80,80,.16)}
  .slide h1{font-size:62px;line-height:1.08;letter-spacing:-1px;margin-bottom:34px}
  .slide .lead{font-size:26px;color:#aab8d6;max-width:60ch}

  /* COVER */
  .cover{-webkit-align-items:center;align-items:center;text-align:center}
  .cover .hello{font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#568393;font-weight:700;margin-bottom:18px}
  .cover h1{font-size:104px;line-height:1}
  .cover h1 .amp{color:#FF5050}
  .cover .tag{font-size:30px;color:#aab8d6;margin-top:18px}
  .cover .chips{margin-top:38px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
  .chip{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:12px 24px;font-size:20px;font-weight:600;margin:7px}
  .chip.blue{background:#024AD8}
  .chip.orange{background:#FF5050}

  /* AGENDA / LISTA */
  .rows{margin-top:6px}
  .row{
    display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
    border-left:4px solid #024AD8;
    border-radius:16px;padding:24px 34px;margin-bottom:18px;
  }
  .rows .row:last-child{margin-bottom:0}
  .row .when{min-width:200px;margin-right:34px}
  .row .rday{font-size:28px;font-weight:700;color:#FF5050;line-height:1.1}
  .row .rhora{font-size:18px;color:#aab8d6;margin-top:3px}
  .row .what{font-size:28px;font-weight:600;margin-right:34px}
  .row .where{margin-left:auto;font-size:20px;color:#aab8d6;padding-left:24px}

  /* ANUNCIOS / BULLETS */
  .bullets{margin-top:6px}
  .bullets li{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;list-style:none;margin-bottom:30px}
  .bullets li:last-child{margin-bottom:0}
  .bullets .ic{-webkit-flex:0 0 auto;flex:0 0 auto;width:64px;height:64px;border-radius:16px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-size:32px;background:#024AD8;margin-right:34px}
  .bullets li:nth-child(3n+2) .ic{background:#FF5050}
  .bullets li:nth-child(3n+3) .ic{background:#568393}
  .bullets .bt{font-size:30px;font-weight:700}
  .bullets .bd{font-size:22px;color:#aab8d6;margin-top:7px;line-height:1.45}

  /* COUNTDOWN */
  .count{-webkit-align-items:center;align-items:center;text-align:center}
  .count .units{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;margin-top:26px}
  .count .u{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:26px 34px;min-width:170px;margin:0 15px}
  .count .u .n{font-size:88px;font-weight:700;line-height:1}
  .count .u .l{font-size:18px;letter-spacing:3px;text-transform:uppercase;color:#aab8d6;margin-top:10px}

  /* QUOTE */
  .quote{-webkit-align-items:center;align-items:center;text-align:center}
  .quote blockquote{font-size:54px;line-height:1.18;font-weight:700;max-width:24ch;position:relative}
  .quote blockquote:before{content:"\201C";color:#FF5050;font-size:120px;line-height:0;position:absolute;left:-60px;top:34px}
  .quote .by{margin-top:30px;font-size:24px;color:#aab8d6}

  /* CLIMA */
  .clima .wxbig{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:14px}
  .clima .wxbig-ic{font-size:130px;line-height:1;margin-right:46px}
  .clima .wxbig-main{margin-right:46px}
  .clima .wxbig-temp{font-size:120px;font-weight:700;line-height:.9}
  .clima .wxbig-cond{font-size:30px;color:#aab8d6;margin-top:8px}
  .clima .wxbig-side{margin-left:8px}
  .clima .wxbig-side .it{display:inline-block;vertical-align:top;width:150px;margin:0 30px 14px 0}
  .clima .wxbig-side .it b{display:block;font-size:34px;font-weight:700}
  .clima .wxbig-side .it small{display:block;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#aab8d6;margin-top:2px}

  /* CUMPLEAÑOS */
  .cumples{margin-top:10px;overflow:hidden;text-align:center}
  .cu-track{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
  .cu-track.scroll{-webkit-flex-wrap:nowrap;flex-wrap:nowrap;-webkit-justify-content:flex-start;justify-content:flex-start}
  @-webkit-keyframes cuscroll{from{-webkit-transform:translateX(0)}to{-webkit-transform:translateX(-50%)}}
  @keyframes cuscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .cu{-webkit-flex:0 0 auto;flex:0 0 auto;width:248px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:22px;padding:28px 22px;margin:0 13px;text-align:center}
  .cu-photo{width:122px;height:122px;border-radius:50%;background-color:#0c2a66;background-position:center;background-size:cover;background-repeat:no-repeat;border:3px solid #FF5050;box-shadow:0 6px 18px rgba(0,0,0,.3);margin:0 auto}
  .cu-ini{background:#024AD8;line-height:122px;font-size:44px;font-weight:700;color:#fff;text-align:center}
  .cu-name{font-size:25px;font-weight:700;margin-top:18px;line-height:1.15}
  .cu-when{font-size:18px;color:#FF5050;font-weight:600;margin-top:7px}
  .cu-empty{font-size:26px;color:#aab8d6;margin-top:14px}

  /* FOTO a pantalla completa */
  .foto{padding:0}
  .foto .foto-bg{position:absolute;top:0;right:0;bottom:0;left:0;background-color:#0c2a66;background-position:center;background-size:cover;background-repeat:no-repeat}
  /* Eliminamos el overlay oscuro para que las fotos se vean más nítidas */
  .foto:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:transparent;pointer-events:none}
  .foto .foto-cap{position:absolute;left:64px;bottom:60px;z-index:2;max-width:70%}
  .foto .foto-t{font-size:56px;font-weight:700;line-height:1.05}
  .foto .foto-d{font-size:24px;color:#d7e0f5;margin-top:10px}

  /* PIE / PROGRESO */
  .footer{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex:0 0 auto;flex:0 0 auto;padding:14px 56px 22px}
  .dots{display:-webkit-flex;display:flex}
  .dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.22);margin-right:10px;-webkit-transition:all .3s;transition:all .3s}
  .dots i.on{background:#FF5050;width:34px;border-radius:6px}
  .footer .tick{margin-left:auto;font-size:15px;color:#aab8d6;letter-spacing:2px;text-transform:uppercase}
  .progress{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08)}
  .progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#024AD8,#FF5050)}

  .help{position:fixed;left:56px;bottom:34px;font-size:13px;color:rgba(255,255,255,.4);opacity:0;-webkit-transition:opacity .3s;transition:opacity .3s}
  body.show-cursor{cursor:default}
  body.show-cursor .help{opacity:1}
  /* Limpieza agresiva: ocultar cualquier elemento fixed en esquina inferior izquierda (típico de overlays residuales) */
  div[style*="position:fixed"][style*="left:"][style*="bottom:"],
  div[style*="left:1"][style*="bottom:1"][style*="fixed"],
  *[style*="rgba(176,0,32"],
  *[style*="255,255,255,.4"][style*="background:"] {
    display:none !important; visibility:hidden !important; pointer-events:none !important;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="stripe"></div>

  <header class="topbar">
    <img class="brand-logo" src="assets/hp-roundel.svg" alt="HP" onerror="this.style.display='none'">
    <div class="brandtxt">
      <div class="team">Work <span class="amp">&amp;</span> Fun '26</div>
      <div class="sub">HP Argentina</div>
    </div>
    <div class="right">
      <div class="wx" id="wx" hidden>
        <div class="wx-ic" id="wxIc">⛅</div>
        <div class="wx-meta">
          <div class="wx-temp" id="wxTemp">--°</div>
          <div class="wx-city">Buenos Aires</div>
        </div>
      </div>
      <div class="clockbox">
        <div class="time" id="clock">--:--</div>
        <div class="date" id="today">—</div>
      </div>
    </div>
  </header>

  <section id="slides">
    <!-- las slides se inyectan por JS -->
  </section>

  <footer class="footer">
    <div class="dots" id="dots"></div>
    <div class="tick">Work &amp; Fun '26</div>
  </footer>

  <div class="progress"><span id="bar"></span></div>
</div>
<div class="help">Flechas ← → cambian de slide · barra espaciadora pausa · F11 pantalla completa</div>

<script>
// Polyfills para el navegador integrado de TVs viejas (webOS): APIs que no existen en Chrome <51.
if (window.NodeList && !NodeList.prototype.forEach) NodeList.prototype.forEach = Array.prototype.forEach;
if (window.Element && !Element.prototype.remove) Element.prototype.remove = function () { if (this.parentNode) this.parentNode.removeChild(this); };
</script>
<script>
/* =================================================================
   CONTENIDO DE LA CARTELERA  ·  Work & Fun '26
   -----------------------------------------------------------------
   Editá SOLO este bloque para cambiar lo que se ve.
   Cada slide es un objeto. Tipos disponibles:
     "cover"     portada grande del equipo
     "agenda"    lista de horarios (items: {when, what, where})
     "anuncios"  lista de avisos con ícono (items: {icon, title, desc})
     "countdown" cuenta regresiva a una fecha (target: "2026-12-20T18:00")
     "quote"     frase destacada (text, by)
     "clima"     clima de Buenos Aires EN VIVO (solo si la pantalla tiene internet;
                 si no hay internet, la slide se saltea sola)
     "cumples"   cumpleaños del mes actual (items: {date:"MM-DD", name})
                 muestra automáticamente solo los del mes en curso
     "foto"      foto a pantalla completa (src, title, caption)
                 poné la imagen en la carpeta assets/ y referenciala: src:"assets/equipo.jpg"
     "info"      título + texto libre
   "secs" = segundos que dura esa slide (opcional, por defecto 10).
   ================================================================= */
// Contenido por defecto: se usa si la cartelera no puede leer el back office (p. ej. sin internet).
var DEFAULT_DATA = {
  novedades: [{
    dia: "Lunes",
    when: "09:30",
    what: "Kickoff y objetivos del trimestre",
    where: "Sala Andes"
  }, {
    dia: "Miércoles",
    when: "13:00",
    what: "Almuerzo del equipo",
    where: "Patio central"
  }, {
    dia: "Jueves",
    when: "16:00",
    what: "Demo & coffee",
    where: "Hub creativo"
  }, {
    dia: "Viernes",
    when: "17:30",
    what: "After: Work & Fun '26",
    where: "Terraza"
  }],
  cumples: [{
    date: "06-08",
    name: "Lucía Fernández"
  }, {
    date: "06-21",
    name: "Martín Gómez"
  }, {
    date: "06-29",
    name: "Sofía Ramírez"
  }, {
    date: "07-04",
    name: "Diego Pérez"
  }],
  fotos: [],
  config: {
    portada_hola: "Bienvenidos al equipo",
    portada_tag: "Donde el trabajo se hace... y se disfruta.",
    clima_activo: "si",
    clima_ciudad: "Buenos Aires",
    clima_lat: "-34.6131",
    clima_lon: "-58.3772",
    evento_titulo: "Falta para la fiesta de fin de año",
    evento_fecha: "2026-12-19T19:00:00",
    frase_texto: "Solos llegamos rápido; juntos llegamos lejos.",
    frase_autor: "— Equipo Work & Fun '26"
  }
};

// Arma la lista de slides a partir del contenido que viene del back office.
function makeSlides(data) {
  data = data || DEFAULT_DATA;
  var cfg = data.config || {};
  var mm = pad(new Date().getMonth() + 1);
  var slides = [];
  var on = function on(k) {
    return (cfg[k] || "si") !== "no";
  }; // cada sección se publica salvo que esté en "no"
  // tiempo por sección configurable desde el back office (secs_*); si no hay valor válido, usa el sugerido
  var secsOf = function secsOf(k, def) {
    var v = parseFloat(cfg['secs_' + k]);
    return v >= 3 && v <= 600 ? v : def;
  };
  if (on("pub_portada")) slides.push({
    type: "cover",
    hello: cfg.portada_hola || "Bienvenidos al equipo",
    title: ["Work ", "&", " Fun ", "'26"],
    tag: cfg.portada_tag || "",
    chips: [{
      text: "Equipo HP",
      style: "blue"
    }, {
      text: "Edición 2026",
      style: ""
    }, {
      text: "#WorkAndFun",
      style: "orange"
    }],
    secs: secsOf("portada", 9)
  });
  if (on("pub_novedades") && (data.novedades || []).length) slides.push({
    type: "agenda",
    eyebrow: "Novedades Work & Fun",
    title: "Agenda del mes",
    items: data.novedades,
    secs: secsOf("novedades", 13)
  });

  // sugerido: lo necesario para que el carrusel muestre TODOS los cumpleaños (~3 s por tarjeta)
  var cuCount = (data.cumples || []).filter(function (c) {
    return (c.date || '').slice(0, 2) === mm;
  }).length;
  if (on("pub_cumples") && cuCount) slides.push({
    type: "cumples",
    items: data.cumples,
    secs: secsOf("cumples", cuCount > 4 ? cuCount * 3 + 4 : 11)
  });
  if (on("pub_fotos")) (data.fotos || []).filter(function (f) {
    return f.src;
  }).forEach(function (f) {
    return slides.push({
      type: "foto",
      src: f.src,
      title: f.title || "",
      caption: f.caption || "",
      secs: secsOf("fotos", 9)
    });
  });
  if (on("clima_activo")) slides.push({
    type: "clima",
    ciudad: cfg.clima_ciudad || "Buenos Aires",
    secs: secsOf("clima", 10)
  });
  if (on("pub_countdown") && cfg.evento_fecha) slides.push({
    type: "countdown",
    eyebrow: "Cuenta regresiva",
    title: cfg.evento_titulo || "",
    target: cfg.evento_fecha,
    secs: secsOf("countdown", 11)
  });
  if (on("pub_frase") && cfg.frase_texto) slides.push({
    type: "quote",
    text: cfg.frase_texto,
    by: cfg.frase_autor || "",
    secs: secsOf("frase", 9)
  });
  return slides;
}

/* =================== Motor de la cartelera =================== */
var slidesEl = document.getElementById('slides');
var dotsEl = document.getElementById('dots');
var barEl = document.getElementById('bar');
var DEFAULT_SECS = 10;
var ASSET_VER = '20';
function normalizeAsset(u) {
  if (!u) return u;
  try {
    return u.indexOf('?') === -1 ? u + '?v=' + ASSET_VER : u + '&v=' + ASSET_VER;
  } catch (e) {
    return u;
  }
}
function el(html) {
  var t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function buildCover(s) {
  var chips = (s.chips || []).map(function (c) {
    return "<span class=\"chip ".concat(c.style || '', "\">").concat(c.text, "</span>");
  }).join('');
  var title = (s.title || []).map(function (p) {
    return p === "&" ? "<span class=\"amp\">&amp;</span>" : p;
  }).join('');
  return "<div class=\"slide cover\">\n    <div class=\"hello\">".concat(s.hello || '', "</div>\n    <h1>").concat(title, "</h1>\n    <div class=\"tag\">").concat(s.tag || '', "</div>\n    <div class=\"chips\">").concat(chips, "</div>\n  </div>");
}
function buildAgenda(s) {
  var rows = (s.items || []).map(function (i) {
    var dia = i.dia || '',
      when = i.when || '';
    var left = dia && when ? "<div class=\"rday\">".concat(dia, "</div><div class=\"rhora\">").concat(when, "</div>") : "<div class=\"rday\">".concat(dia || when, "</div>");
    return "<div class=\"row\"><div class=\"when\">".concat(left, "</div><div class=\"what\">").concat(i.what || '', "</div><div class=\"where\">").concat(i.where || '', "</div></div>");
  }).join('');
  return "<div class=\"slide\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>".concat(s.eyebrow || '', "</div>\n    <h1>").concat(s.title || '', "</h1>\n    <div class=\"rows\">").concat(rows, "</div>\n  </div>");
}
function buildAnuncios(s) {
  var items = (s.items || []).map(function (i) {
    return "<li><div class=\"ic\">".concat(i.icon || '•', "</div><div><div class=\"bt\">").concat(i.title || '', "</div><div class=\"bd\">").concat(i.desc || '', "</div></div></li>");
  }).join('');
  return "<div class=\"slide\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>".concat(s.eyebrow || '', "</div>\n    <h1>").concat(s.title || '', "</h1>\n    <ul class=\"bullets\">").concat(items, "</ul>\n  </div>");
}
function buildCountdown(s) {
  return "<div class=\"slide count\" data-target=\"".concat(s.target || '', "\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>").concat(s.eyebrow || '', "</div>\n    <h1>").concat(s.title || '', "</h1>\n    <div class=\"units\">\n      <div class=\"u\"><div class=\"n\" data-u=\"d\">0</div><div class=\"l\">d\xEDas</div></div>\n      <div class=\"u\"><div class=\"n\" data-u=\"h\">0</div><div class=\"l\">horas</div></div>\n      <div class=\"u\"><div class=\"n\" data-u=\"m\">0</div><div class=\"l\">min</div></div>\n      <div class=\"u\"><div class=\"n\" data-u=\"s\">0</div><div class=\"l\">seg</div></div>\n    </div>\n  </div>");
}
function buildQuote(s) {
  return "<div class=\"slide quote\">\n    <blockquote>".concat(s.text || '', "</blockquote>\n    <div class=\"by\">").concat(s.by || '', "</div>\n  </div>");
}
function buildInfo(s) {
  return "<div class=\"slide\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>".concat(s.eyebrow || '', "</div>\n    <h1>").concat(s.title || '', "</h1>\n    <p class=\"lead\">").concat(s.body || '', "</p>\n  </div>");
}
function buildClima(s) {
  return "<div class=\"slide clima\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>El clima ahora</div>\n    <h1>".concat(s.ciudad || 'Buenos Aires', "</h1>\n    <div class=\"wxbig\">\n      <div class=\"wxbig-ic\" id=\"cIc\">\u26C5</div>\n      <div class=\"wxbig-main\">\n        <div class=\"wxbig-temp\" id=\"cTemp\">--\xB0</div>\n        <div class=\"wxbig-cond\" id=\"cCond\">Conectando\u2026</div>\n      </div>\n      <div class=\"wxbig-side\">\n        <div class=\"it\"><b id=\"cMax\">--\xB0</b><small>M\xE1xima</small></div>\n        <div class=\"it\"><b id=\"cMin\">--\xB0</b><small>M\xEDnima</small></div>\n        <div class=\"it\"><b id=\"cWind\">-- km/h</b><small>Viento</small></div>\n        <div class=\"it\"><b id=\"cHum\">--%</b><small>Humedad</small></div>\n      </div>\n    </div>\n  </div>");
}
function buildCumples(s) {
  var now = new Date();
  var mm = pad(now.getMonth() + 1);
  var monthName = now.toLocaleDateString('es-AR', {
    month: 'long'
  });
  var cap = function cap(t) {
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  var list = (s.items || []).filter(function (i) {
    return (i.date || '').slice(0, 2) === mm;
  }).sort(function (a, b) {
    return a.date.localeCompare(b.date);
  });
  if (!list.length) {
    return "<div class=\"slide\">\n      <div class=\"eyebrow\"><span class=\"dot\"></span>Cumplea\xF1os del mes</div>\n      <h1>\uD83C\uDF82 ".concat(cap(monthName), "</h1>\n      <div class=\"cu-empty\">Sin cumplea\xF1os este mes \uD83C\uDF88</div>\n    </div>");
  }
  var card = function card(i) {
    var day = parseInt(i.date.slice(3), 10);
    var ini = (i.name || '').trim().split(/\s+/).map(function (w) {
      return w[0] || '';
    }).slice(0, 2).join('').toUpperCase();
    var photo = i.foto ? "<div class=\"cu-photo\" style=\"background-image:url('".concat(normalizeAsset(i.foto), "')\"></div>") : "<div class=\"cu-photo cu-ini\">".concat(ini || '🎂', "</div>");
    var fecha = "".concat(day, " de ").concat(monthName) + (i.dia ? " \xB7 ".concat(i.dia) : '');
    return "<div class=\"cu\">".concat(photo, "<div class=\"cu-name\">").concat(i.name || '', "</div><div class=\"cu-when\">").concat(fecha, "</div></div>");
  };
  var cards = list.map(card).join('');
  var carousel = list.length > 4; // si hay muchos, carrusel; lo desplaza el motor en sincronía con la barra de tiempo
  var track = carousel ? "<div class=\"cu-track scroll\">".concat(cards, "</div>") : "<div class=\"cu-track center\">".concat(cards, "</div>");
  return "<div class=\"slide\">\n    <div class=\"eyebrow\"><span class=\"dot\"></span>Cumplea\xF1os del mes</div>\n    <h1>\uD83C\uDF82 ".concat(cap(monthName), "</h1>\n    <div class=\"cumples\">").concat(track, "</div>\n  </div>");
}
function buildFoto(s) {
  return "<div class=\"slide foto\">\n    <div class=\"foto-bg\" style=\"background-image:url('".concat(normalizeAsset(s.src || ''), "')\"></div>\n    <div class=\"foto-cap\"><div class=\"foto-t\">").concat(s.title || '', "</div><div class=\"foto-d\">").concat(s.caption || '', "</div></div>\n  </div>");
}
var BUILDERS = {
  cover: buildCover,
  agenda: buildAgenda,
  anuncios: buildAnuncios,
  countdown: buildCountdown,
  quote: buildQuote,
  clima: buildClima,
  cumples: buildCumples,
  foto: buildFoto,
  info: buildInfo
};

// estado del motor
var SLIDES = [],
  slideNodes = [],
  dotNodes = [],
  idx = 0,
  paused = false,
  t0 = performance.now(),
  raf,
  weatherOK = false,
  started = false,
  lastDataStr = '';
var WX = {
  lat: -34.6131,
  lon: -58.3772
};

// (re)dibuja todas las slides a partir de SLIDES
function render() {
  slidesEl.querySelectorAll('.slide').forEach(function (n) {
    return n.remove();
  });
  dotsEl.innerHTML = '';
  SLIDES.forEach(function (s) {
    slidesEl.appendChild(el((BUILDERS[s.type] || buildInfo)(s)));
    dotsEl.appendChild(document.createElement('i'));
  });
  slideNodes = Array.prototype.slice.call(slidesEl.querySelectorAll('.slide'));
  dotNodes = Array.prototype.slice.call(dotsEl.children);
  idx = 0;
  t0 = performance.now();
  if (slideNodes.length) {
    slideNodes[0].classList.add('active');
    dotNodes[0].classList.add('on');
  }
  refreshClimaDots();
}
// Desplaza el carrusel de cumpleaños en sincronía EXACTA con la barra de tiempo de la slide:
// arranca en el primer cumpleañero al entrar y termina anclado en los últimos un poco antes
// del cambio de slide (así la última persona siempre se ve, y no hay "vuelta a empezar").
function driveCumples(p) {
  var s = SLIDES[idx];
  if (!s || s.type !== 'cumples') return;
  var tr = slideNodes[idx].querySelector('.cu-track.scroll');
  if (!tr) return;
  var travel = tr.scrollWidth - tr.parentNode.clientWidth; // cuánto hay que recorrer para llegar al final
  if (travel <= 0) return;
  var q = Math.min(1, p / 0.94); // completa el recorrido al 94% del tiempo y ahí se queda
  var x = -Math.round(travel * q);
  tr.style.webkitTransform = 'translateX(' + x + 'px)';
  tr.style.transform = 'translateX(' + x + 'px)';
}
// ¿se puede mostrar esta slide? (el clima se saltea si no hay datos / no hay internet)
function visible(i) {
  return !(SLIDES[i].type === 'clima' && !weatherOK);
}
function show(i, dir) {
  dir = dir || 1;
  var n = (i + SLIDES.length) % SLIDES.length,
    guard = 0;
  while (!visible(n) && guard++ < SLIDES.length) {
    n = (n + dir + SLIDES.length) % SLIDES.length;
  }
  slideNodes[idx].classList.remove('active');
  dotNodes[idx].classList.remove('on');
  idx = n;
  slideNodes[idx].classList.add('active');
  dotNodes[idx].classList.add('on');
  t0 = performance.now();
}
function next() {
  show(idx + 1, 1);
}
function prev() {
  show(idx - 1, -1);
}
function loop(now) {
  var dur = (SLIDES[idx].secs || DEFAULT_SECS) * 1000;
  if (!paused) {
    var p = Math.min(1, (now - t0) / dur);
    barEl.style.width = p * 100 + '%';
    driveCumples(p);
    if (p >= 1) next();
  }
  updateCountdowns();
  raf = requestAnimationFrame(loop);
}

// reloj
function tick() {
  var d = new Date();
  document.getElementById('clock').textContent = d.toLocaleTimeString('es-AR', {
    hour: '2-digit',
    minute: '2-digit'
  });
  document.getElementById('today').textContent = d.toLocaleDateString('es-AR', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
}
function pad(n) {
  n = String(n);
  return n.length < 2 ? '0' + n : n;
}
function updateCountdowns() {
  slidesEl.querySelectorAll('.count[data-target]').forEach(function (c) {
    var tg = new Date(c.dataset.target).getTime();
    if (isNaN(tg)) return;
    var diff = Math.max(0, tg - Date.now());
    var d = Math.floor(diff / 864e5);
    diff -= d * 864e5;
    var h = Math.floor(diff / 36e5);
    diff -= h * 36e5;
    var m = Math.floor(diff / 6e4);
    diff -= m * 6e4;
    var s = Math.floor(diff / 1e3);
    c.querySelector('[data-u=d]').textContent = d;
    c.querySelector('[data-u=h]').textContent = pad(h);
    c.querySelector('[data-u=m]').textContent = pad(m);
    c.querySelector('[data-u=s]').textContent = pad(s);
  });
}

// ============ CLIMA EN VIVO · Buenos Aires (Open-Meteo, sin API key) ============
// Códigos WMO -> emoji + texto en español
function wmo(c) {
  var M = {
    0: ['☀️', 'Despejado'],
    1: ['🌤️', 'Mayormente despejado'],
    2: ['⛅', 'Parcialmente nublado'],
    3: ['☁️', 'Nublado'],
    45: ['🌫️', 'Niebla'],
    48: ['🌫️', 'Niebla con escarcha'],
    51: ['🌦️', 'Llovizna leve'],
    53: ['🌦️', 'Llovizna'],
    55: ['🌦️', 'Llovizna intensa'],
    56: ['🌧️', 'Llovizna helada'],
    57: ['🌧️', 'Llovizna helada'],
    61: ['🌧️', 'Lluvia leve'],
    63: ['🌧️', 'Lluvia'],
    65: ['🌧️', 'Lluvia intensa'],
    66: ['🌧️', 'Lluvia helada'],
    67: ['🌧️', 'Lluvia helada'],
    71: ['🌨️', 'Nieve leve'],
    73: ['🌨️', 'Nieve'],
    75: ['🌨️', 'Nieve intensa'],
    77: ['🌨️', 'Nieve'],
    80: ['🌦️', 'Chaparrones'],
    81: ['🌦️', 'Chaparrones'],
    82: ['⛈️', 'Chaparrones fuertes'],
    85: ['🌨️', 'Nevadas'],
    86: ['🌨️', 'Nevadas'],
    95: ['⛈️', 'Tormenta'],
    96: ['⛈️', 'Tormenta con granizo'],
    99: ['⛈️', 'Tormenta con granizo']
  };
  return M[c] || ['🌡️', '—'];
}
function setTxt(id, v) {
  var e = document.getElementById(id);
  if (e) e.textContent = v;
}
function refreshClimaDots() {
  // oculta el punto de la slide de clima si no hay datos (queda salteada)
  SLIDES.forEach(function (s, i) {
    if (s.type === 'clima') dotNodes[i].style.display = weatherOK ? '' : 'none';
  });
}
// GET por XMLHttpRequest (funciona en el navegador viejo de las TVs, que NO tiene fetch).
function httpGetText(url, onOk, onErr) {
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status >= 200 && xhr.status < 300) onOk(xhr.responseText);else if (onErr) onErr();
    };
    xhr.onerror = function () { if (onErr) onErr(); };
    if ('timeout' in xhr) {
      xhr.timeout = 12000;
      xhr.ontimeout = function () { if (onErr) onErr(); };
    }
    xhr.send();
  } catch (e) { if (onErr) onErr(); }
}
// Pinta el clima (online o desde el último guardado); isStale marca datos viejos.
function applyWeatherData(j, isStale) {
  var cur = j.current,
    day = j.daily,
    w = wmo(cur.weather_code);
  var t = Math.round(cur.temperature_2m);
  setTxt('wxTemp', t + '°');
  setTxt('wxIc', w[0]);
  setTxt('cIc', w[0]);
  setTxt('cTemp', t + '°');
  setTxt('cCond', w[1] + (isStale ? ' (última)' : ''));
  setTxt('cMax', Math.round(day.temperature_2m_max[0]) + '°');
  setTxt('cMin', Math.round(day.temperature_2m_min[0]) + '°');
  setTxt('cWind', Math.round(cur.wind_speed_10m) + ' km/h');
  setTxt('cHum', Math.round(cur.relative_humidity_2m) + '%');
  weatherOK = true;
  var wxEl = document.getElementById('wx');
  if (wxEl) wxEl.hidden = false;
  refreshClimaDots();
}
// Fallback: usa el último clima guardado; si no hay, oculta la sección.
function useStoredWeather() {
  var stored = null;
  try {
    stored = JSON.parse(localStorage.getItem('cartelera_weather'));
  } catch (e) { stored = null; }
  if (stored && stored.j && stored.j.current) applyWeatherData(stored.j, true);else {
    weatherOK = false;
    hideWx_();
    refreshClimaDots();
  }
}
function fetchWeather() {
  // si la slide de clima no existe, no pedimos nada
  if (!SLIDES.some(function (s) {
    return s.type === 'clima';
  })) return;
  // JSONP al back office (Google pide el clima y nos lo pasa): el navegador viejo de las TVs
  // no puede conectarse directo a Open-Meteo por TLS, pero a Google (script.google.com) sí.
  var fn = '__wx' + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var done = false;
  var finish = function finish(j) {
    if (done) return;
    done = true;
    try {
      delete window[fn];
    } catch (e) {}
    if (s.parentNode) s.parentNode.removeChild(s);
    if (j && j.current) {
      applyWeatherData(j, false);
      try {
        localStorage.setItem('cartelera_weather', JSON.stringify({ t: Date.now(), j: j }));
      } catch (e) {}
    } else {
      useStoredWeather();
    }
  };
  window[fn] = finish;
  s.onerror = function () { finish(null); };
  s.src = DATA_URL + '?action=weather&callback=' + fn + '&_=' + Date.now();
  document.body.appendChild(s);
  setTimeout(function () { finish(null); }, 12000);
}
function hideWx_() {
  var wxEl = document.getElementById('wx');
  if (wxEl) wxEl.hidden = true;
}

// controles
document.addEventListener('keydown', function (e) {
  var k = (e && e.key) || '';   // el control remoto de algunas TVs manda eventos sin e.key (undefined)
  if (k === 'ArrowRight') next();else if (k === 'ArrowLeft') prev();else if (k === ' ') {
    paused = !paused;
    if (e && e.preventDefault) e.preventDefault();
  } else if ((k || '').toLowerCase() === 'f') {
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();else if (document.exitFullscreen) document.exitFullscreen();
  }
});
// mostrar el cursor solo al moverlo
var curTimer;
document.addEventListener('mousemove', function () {
  document.body.classList.add('show-cursor');
  clearTimeout(curTimer);
  curTimer = setTimeout(function () {
    return document.body.classList.remove('show-cursor');
  }, 2500);
});

// ============ CONEXIÓN CON EL BACK OFFICE ============
var DATA_URL = 'https://script.google.com/macros/s/AKfycbxAt5gQYspry28ntaEweGr0Wp4myCLObjB9N81Wc4c3OjGEujtUqreuxn57adss2UNPZg/exec';
var PREVIEW = /[?&]preview=1/.test(location.search);
function applyData(data) {
  if (data && data.updatedAt) delete data.updatedAt; // campo volátil (cambia en cada consulta): sin esto, el poll de 20 s reiniciaba la cartelera a la slide 1
  var str = JSON.stringify(data);
  if (str === lastDataStr) return; // sin cambios -> no re-dibuja
  lastDataStr = str;
  var cfg = data && data.config || {};
  WX.lat = parseFloat(cfg.clima_lat) || -34.6131;
  WX.lon = parseFloat(cfg.clima_lon) || -58.3772;
  var cityEl = document.querySelector('.wx-city');
  if (cityEl) cityEl.textContent = cfg.clima_ciudad || 'Buenos Aires';
  SLIDES = makeSlides(data);
  render();
  if (!started) {
    startEngine();
    started = true;
  }
  fetchWeather();
}
function startEngine() {
  tick();
  setInterval(tick, 1000);
  setInterval(fetchWeather, 15 * 60 * 1000);
  raf = requestAnimationFrame(loop);
}
// JSONP: lee el contenido del back office sin problemas de CORS desde GitHub Pages
function fetchData(cb) {
  var fn = '__cb' + Math.random().toString(36).slice(2);
  var s = document.createElement('script');
  var done = false;
  var finish = function finish(d) {
    if (done) return;
    done = true;
    try {
      delete window[fn];
    } catch (e) {}
    s.remove();
    cb(d);
  };
  window[fn] = finish;
  s.onerror = function () {
    return finish(null);
  };
  s.src = DATA_URL + '?action=data&callback=' + fn + '&t=' + Date.now();
  document.body.appendChild(s);
  setTimeout(function () {
    return finish(null);
  }, 8000); // si no responde (offline / sin permisos) -> usa default
}
if (PREVIEW) {
  // modo vista previa: el back office manda el contenido por postMessage al editar
  applyData(DEFAULT_DATA);
  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (m && m.type === 'cartelera-data' && m.data) {
      lastDataStr = '';
      applyData(m.data);
    }
  });
} else {
  var checkVersion = function checkVersion() {
    // XHR (no fetch): el navegador de las TVs viejas no tiene fetch, y sin esto nunca se
    // auto-recargaba al publicar una versión nueva (había que recargar a mano).
    httpGetText('version.txt?t=' + Date.now(), function (v) {
      v = v ? v.trim() : '';
      // El SSO de HP puede responder con su página HTML de login y status 200:
      // solo un número es una versión válida; cualquier otra cosa se ignora (si no, la TV
      // se recargaba en loop cada 90 s y cortaba el ciclo a mitad de la última slide).
      if (!/^\d+$/.test(v) || v === VERSION) return;
      // Si ya recargamos por esta misma versión hace poco y seguimos viendo la vieja
      // (cache de Pages), esperamos a que expire en vez de recargar cada 90 s.
      var prev = null;
      try {
        prev = JSON.parse(localStorage.getItem('cartelera_reload'));
      } catch (e) {}
      if (prev && prev.v === v && Date.now() - prev.t < 10 * 60 * 1000) return;
      try {
        localStorage.setItem('cartelera_reload', JSON.stringify({
          v: v,
          t: Date.now()
        }));
      } catch (e) {}
      location.reload();
    });
  };
  // modo TV: lee del back office; si no hay internet usa el contenido por defecto
  fetchData(function (d) {
    return applyData(d || DEFAULT_DATA);
  });
  setInterval(function () {
    return fetchData(function (d) {
      if (d) applyData(d);
    });
  }, 20 * 1000); // consulta cambios cada 20 s

  // AUTO-ACTUALIZACIÓN DE CÓDIGO: si subo una versión nueva del diseño, la TV se recarga sola.
  var VERSION = '24';
  setInterval(checkVersion, 90 * 1000); // chequea versión cada 90 s
}
